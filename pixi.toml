[workspace]
name = "caffeine"
version = "0.1.0"
description = "CoArray Fortran Framework of Efficient Interfaces to Network Environments"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
fpm = "*"
pkg-config = "*"
coreutils = "*"
make = "*"
git = "*"
curl = "*"

[tasks]
build = { cmd = "./run-fpm.sh build", depends-on = ["configure"], description = "Build caffeine" }
test = { cmd = "./run-fpm.sh test", depends-on = ["configure"], description = "Run tests" }
clean = "rm -rf build fpm.toml run-fpm.sh"

[feature.gfortran]
platforms = ["osx-arm64"]

[feature.gfortran.tasks]
configure = { cmd = """
GASNET_PREFIX=$(cd ../gasnet/.pixi/envs/default && pwd) && \
PREFIX=$(pwd)/build/local && \
mkdir -p $PREFIX/lib/pkgconfig && \
env FC=gfortran \
    CC=$GASNET_PREFIX/bin/clang \
    CXX=$GASNET_PREFIX/bin/clang++ \
    PKG_CONFIG_PATH=$GASNET_PREFIX/lib/pkgconfig \
    ./install.sh --yes --prefix=$PREFIX
""", description = "Configure and build with install.sh using gfortran and pre-built GASNet" }

[environments]
gfortran = { features = ["gfortran"], solve-group = "default" }
