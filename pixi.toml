[workspace]
name = "caffeine"
version = "0.1.0"
description = "CoArray Fortran Framework of Efficient Interfaces to Network Environments"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
cmake = ">=3.20"
make = "*"
pkg-config = "*"
git = "*"

[tasks]
build = { cmd = "cmake --build build -j1", depends-on = ["configure"], description = "Build caffeine" }
test = { cmd = "./build/test_native_multi_image && ./build/test_julienne_suite", depends-on = ["build"], description = "Run tests" }
clean = "rm -rf build"

[feature.flang]
platforms = ["osx-arm64"]

[feature.flang.tasks]
configure = { cmd = """
cmake -B build \
  -DCMAKE_C_COMPILER=$HOME/repos/llvm/llvm-build-env/install/bin/clang \
  -DCMAKE_CXX_COMPILER=$HOME/repos/llvm/llvm-build-env/install/bin/clang++ \
  -DCMAKE_Fortran_COMPILER=$HOME/bin/flang \
  -DBUILD_SHARED_LIBS=OFF \
  -DGASNet_ROOT=$(cd ../gasnet/.pixi/envs/default && pwd)
""", description = "Configure with CMake using flang and local GASNet" }

[feature.lfortran]
platforms = ["osx-arm64"]

[feature.lfortran.tasks]
configure = { cmd = """
cmake -B build \
  -DCMAKE_C_COMPILER=clang \
  -DCMAKE_CXX_COMPILER=clang++ \
  -DCMAKE_Fortran_COMPILER=lfortran \
  -DBUILD_SHARED_LIBS=OFF \
  -DGASNet_ROOT=$(cd ../gasnet/.pixi/envs/default && pwd)
""", description = "Configure with CMake using lfortran and local GASNet" }

[feature.gfortran]
platforms = ["osx-arm64"]

[feature.gfortran.tasks]
configure = { cmd = """
cmake -B build \
  -DCMAKE_C_COMPILER=clang \
  -DCMAKE_CXX_COMPILER=clang++ \
  -DCMAKE_Fortran_COMPILER=gfortran \
  -DBUILD_SHARED_LIBS=OFF \
  -DGASNet_ROOT=$(cd ../gasnet/.pixi/envs/default && pwd)
""", description = "Configure with CMake using gfortran and local GASNet" }

[environments]
flang = { features = ["flang"], solve-group = "default" }
gfortran = { features = ["gfortran"], solve-group = "default" }
lfortran = { features = ["lfortran"], solve-group = "default" }
